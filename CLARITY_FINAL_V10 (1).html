<title>CLARITY</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overscroll-behavior:none;}
:root{--bg:#0c0c0c;--s1:#111;--s2:#161616;--s3:#1e1e1e;--b:#222;--b2:#1a1a1a;--t:#efefef;--t2:#888;--t3:#444;--t4:#2a2a2a;--a:#c9ff3f;--at:#111;}
.light .logo{text-shadow:0 1px 6px rgba(0,0,0,.2);}
.light .logo{color:#0d0d0d;}
.light{--bg:#f5f5f2;--s1:#fff;--s2:#f0f0ec;--s3:#e5e4e0;--b:#e0e0dc;--b2:#e8e8e4;--t:#111;--t2:#666;--t3:#aaa;--t4:#ccc;}

/* ── SPLASH ── */
.sp{position:fixed;inset:0;background:#0c0c0c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3000;transition:opacity .5s ease;}
.sp.out{opacity:0;pointer-events:none;}
/* Children start visible — JS animates them in for real PWA, visible immediately in preview */
.sp-logo{font-size:38px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#efefef;transition:opacity .6s ease,transform .6s ease;}
.sp-logo em{color:#c9ff3f;font-style:normal;}
.sp-sub{font-size:10px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:#888;margin-top:10px;transition:opacity .5s ease .3s;}
.sp-bar{width:72px;height:2px;background:#181818;border-radius:99px;margin-top:32px;overflow:hidden;transition:opacity .3s ease .5s;}
.sp-fill{height:100%;background:#c9ff3f;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1);}
@keyframes spi{to{opacity:1;transform:translateY(0);}}
@keyframes spf{0%{width:0;}60%{width:70%;}100%{width:100%;}}

/* ── ONBOARDING ── */
.ob{position:fixed;inset:0;background:#0c0c0c;z-index:2000;display:flex;flex-direction:column;opacity:0;transition:opacity .4s;pointer-events:none;}
.ob.show{opacity:1;pointer-events:all;}
.ob-wrap{flex:1;overflow:hidden;}
.ob-track{display:flex;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1);}
.ob-slide{min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;}
.ob-ico{font-size:56px;margin-bottom:28px;}
.ob-ttl{font-size:24px;font-weight:700;color:#efefef;margin-bottom:12px;line-height:1.2;}
.ob-ttl em{color:#c9ff3f;font-style:normal;}
.ob-txt{font-size:14px;font-weight:300;color:#555;line-height:1.8;max-width:280px;}
.ob-txt b{color:#c9ff3f;font-weight:600;}
.ob-foot{padding:24px 32px 44px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.ob-dots{display:flex;gap:7px;}
.ob-dot{width:6px;height:6px;border-radius:99px;background:#1e1e1e;transition:all .3s;}
.ob-dot.on{background:#c9ff3f;width:22px;}
.ob-btn{width:100%;max-width:320px;background:#c9ff3f;color:#111;border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;padding:16px;cursor:pointer;}
.ob-skip{border:none;background:none;font-family:inherit;font-size:12px;color:#2a2a2a;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;}

/* ── APP ── */
.app{opacity:0;transition:opacity .4s;min-height:100vh;}
.app.show{opacity:1;}

/* ── NAV ── */
.nav{display:flex;align-items:center;justify-content:space-between;padding:15px 20px 13px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:50;}
.logo{font-size:14px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--a);}
.nav-r{display:flex;gap:5px;}
.nb{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--b);background:var(--s1);color:var(--t3);cursor:pointer;font-size:11px;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;letter-spacing:.5px;}
.nb:hover{border-color:var(--a);color:var(--t);}

/* ── TABS ── */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--b);}
.tab{
  border:none;background:none;font-family:inherit;font-size:8.5px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;color:var(--t4);
  padding:12px 2px;cursor:pointer;border-bottom:1.5px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .2s,transform .15s cubic-bezier(.34,1.56,.64,1);
  text-align:center;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--t3);}
.tab.on{color:var(--t);border-bottom-color:var(--a);}
.tab.tap-bounce{transform:scale(.88);}
/* Tab ripple */
.tab-ripple{
  position:absolute;border-radius:50%;
  background:rgba(201,255,63,.18);
  transform:scale(0);
  animation:tab-rip .45s ease-out forwards;
  pointer-events:none;
}
@keyframes tab-rip{
  to{transform:scale(3.5);opacity:0;}
}
/* Мгновенное переключение без анимации */


/* ── PAGES ── */
.pg{display:none;padding:18px 18px 20px;}
.pg.on{display:block;}
.sec{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:10px;margin-top:22px;}
.sec:first-child{margin-top:0;}

/* ── HERO ── */
.hero{
  padding:20px 18px 16px;
  margin-bottom:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}
.hero-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  margin-bottom:14px;
}
.rw{
  position:relative;
  width:160px;
  height:160px;
  flex-shrink:0;
  margin-bottom:10px;
}
.rw svg{width:160px;height:160px;transform:rotate(-90deg);display:block;}
/* Smooth arc transitions */
.rw svg circle{transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1),stroke-dashoffset .7s cubic-bezier(.4,0,.2,1),stroke .5s ease,opacity .4s ease;}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rp{font-size:36px;font-weight:200;line-height:1;letter-spacing:-2px;color:var(--t);transition:color .4s;}
.rl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-top:5px;text-align:center;}
/* Pulse when task done */
@keyframes ring-pulse{
  0%{transform:rotate(-90deg) scale(1);}
  40%{transform:rotate(-90deg) scale(1.04);}
  70%{transform:rotate(-90deg) scale(.98);}
  100%{transform:rotate(-90deg) scale(1);}
}
.rw.ring-celebrate svg{animation:ring-pulse .55s cubic-bezier(.34,1.4,.64,1) both;}
/* Completion burst */
@keyframes ring-done-glow{
  0%{opacity:0;transform:scale(.9);}
  50%{opacity:.6;transform:scale(1.12);}
  100%{opacity:0;transform:scale(1.25);}
}
.rw-glow{
  position:absolute;inset:-12px;border-radius:50%;
  pointer-events:none;
  animation:ring-done-glow .7s ease-out both;
}
/* Segment fill animation via CSS */
@keyframes seg-fill{
  from{stroke-dasharray:0 502;}
}
@keyframes st-fadein{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
#pg-stats.on .st-hero{animation:st-fadein .4s ease both;}
#pg-stats.on .sgrid{animation:st-fadein .4s ease .08s both;}
#pg-stats.on .bch-wrap{animation:st-fadein .4s ease .14s both;}
#pg-stats.on .bdrows{animation:st-fadein .4s ease .2s both;}
#pg-stats.on .ilist{animation:st-fadein .4s ease .26s both;}
.ii{animation:st-fadein .35s ease both;}
.ii:nth-child(2){animation-delay:.05s;}
.ii:nth-child(3){animation-delay:.1s;}
.ii:nth-child(4){animation-delay:.15s;}
.ii:nth-child(5){animation-delay:.2s;}
.ii:nth-child(6){animation-delay:.25s;}
.hero-info{text-align:center;width:100%;}
.hdate{font-size:10px;color:var(--t3);letter-spacing:.3px;margin-bottom:4px;}
.hq{font-size:13px;font-weight:300;line-height:1.45;color:var(--t2);margin-bottom:0;}

/* ── STATS ROW ── */
.stats-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border:1px solid var(--b2);
  border-radius:12px;
  overflow:hidden;
  width:100%;
}
.stat-box{
  background:var(--s2);
  padding:13px 4px;
  text-align:center;
  border-right:1px solid var(--b2);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.stat-box:last-child{border-right:none;}
.stat-box .v{
  font-size:22px;
  font-weight:300;
  line-height:1;
  display:block;
  margin-bottom:5px;
  color:var(--t);
  min-width:0;
}
.stat-box .l{
  font-size:8px;
  font-weight:700;
  letter-spacing:.8px;
  text-transform:uppercase;
  display:block;
  color:var(--t3);
}

/* ── CATS ── */
.cats-wrap{position:relative;margin-bottom:12px;}
.cats-wrap::before,.cats-wrap::after{
  content:'';position:absolute;top:0;bottom:2px;width:28px;z-index:2;pointer-events:none;
}
.cats-wrap::before{left:0;background:linear-gradient(to right,var(--bg),transparent);}
.cats-wrap::after{right:0;background:linear-gradient(to left,var(--bg),transparent);}
.cats{
  display:flex;flex-wrap:nowrap;gap:6px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding-bottom:2px;
}
.cats::-webkit-scrollbar{display:none;}
.cat{display:flex;align-items:center;gap:5px;border:1px solid var(--b);border-radius:99px;background:var(--s1);font-size:11px;font-weight:500;color:var(--t3);padding:6px 12px;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap;}
.cat .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cat.on{font-weight:700;}

/* ── ADD ROW ── */
.add-wrap{display:flex;gap:8px;margin-bottom:18px;background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:10px 12px;transition:border-color .15s;}
.add-wrap:focus-within{border-color:var(--a);}
.ai{flex:1;border:none;background:none;font-family:inherit;font-size:14px;color:var(--t);outline:none;}
.ai::placeholder{color:var(--t3);}
.ab{background:var(--a);color:var(--at);border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;padding:8px 14px;cursor:pointer;white-space:nowrap;}

/* ── TASKS ── */
.tlist{display:flex;flex-direction:column;gap:2px;}
.tc{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--b2);transition:background .12s;}
.tc:active{background:var(--s2);}
.tc.done{opacity:.35;}
.tc.done .tn{text-decoration:line-through;}
.ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--b);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;font-weight:700;color:var(--at);transition:all .15s;}
.ck:hover{border-color:var(--a);}
.ti{flex:1;min-width:0;}
.tn{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t);}
.tbg{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-top:4px;}
.ttm{font-size:10px;color:var(--t3);flex-shrink:0;}
.tdl{border:none;background:none;color:var(--t4);cursor:pointer;font-size:18px;padding:0 2px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.tc:hover .tdl{opacity:1;}

.empty{text-align:center;padding:36px 20px;border:1px dashed var(--b);border-radius:14px;}
.ei{font-size:22px;opacity:.18;margin-bottom:10px;}
.et{font-size:12px;color:var(--t3);line-height:1.9;font-weight:300;}

/* ── NOTIF ── */
.nt-bar{background:var(--s1);border:1px solid var(--a);border-radius:14px;padding:13px 15px;display:none;align-items:center;gap:10px;margin-bottom:14px;}
.nt-bar.show{display:flex;}
.nt-txt{flex:1;font-size:12px;color:var(--t2);line-height:1.4;}
.nt-txt b{color:var(--t);font-weight:600;}
.nt-btn{background:var(--a);color:var(--at);border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;padding:8px 13px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* ── WEEK PLANNER MOBILE ── */
.week-days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.wday-card{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:16px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.wday-card:active{transform:scale(.97);}
.wday-card.today{border-color:var(--a);}
.wdc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wdc-name{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);}
.wday-card.today .wdc-name{color:var(--a);}
.wdc-ring{width:32px;height:32px;}
.wdc-ring svg{width:32px;height:32px;transform:rotate(-90deg);display:block;}
.wdc-date{font-size:13px;color:var(--t2);margin-bottom:10px;}
.wday-card.today .wdc-date{color:var(--t);font-weight:600;}
.wdc-bottom{display:flex;align-items:center;justify-content:space-between;}
.wdc-count{font-size:11px;color:var(--t3);}
.wdc-count.all-done{color:var(--a);font-weight:600;}
.wdc-arrow{font-size:18px;color:var(--t3);}

/* ── DAY MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-ov.open{display:flex;}
.modal{background:var(--s1);border:1px solid var(--b);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;animation:mup .25s ease;}
@keyframes mup{from{transform:translateY(50px);opacity:0;}}

.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--b2);flex-shrink:0;}
.modal-title{font-size:17px;font-weight:600;color:var(--t);}
.modal-date{font-size:12px;color:var(--t3);margin-left:8px;}
.modal-close{border:none;background:var(--s2);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--t2);font-size:15px;display:flex;align-items:center;justify-content:center;}

/* cat selector in modal */
.modal-cats-wrap{position:relative;border-bottom:1px solid var(--b2);flex-shrink:0;}
.modal-cats-wrap::before,.modal-cats-wrap::after{
  content:'';position:absolute;top:0;bottom:0;width:24px;z-index:2;pointer-events:none;
}
.modal-cats-wrap::before{left:0;background:linear-gradient(to right,var(--s1),transparent);}
.modal-cats-wrap::after{right:0;background:linear-gradient(to left,var(--s1),transparent);}
.modal-cats{
  display:flex;gap:6px;padding:12px 20px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.modal-cats::-webkit-scrollbar{display:none;}
.mcat{display:flex;align-items:center;gap:5px;border:1px solid var(--b);border-radius:99px;background:var(--bg);font-size:11px;font-weight:500;color:var(--t3);padding:5px 11px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.mcat .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.mcat.on{font-weight:700;}

.modal-body{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:3px;}

.modal-empty{text-align:center;padding:32px 20px;color:var(--t3);font-size:13px;font-weight:300;line-height:1.8;}
.modal-empty .mei{font-size:26px;opacity:.2;margin-bottom:10px;}

.mtask{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:12px;background:var(--s2);font-size:14px;color:var(--t);transition:background .12s;}
.mtask:active{background:var(--s3);}
.mtask.done{opacity:.4;}
.mtask.done .mtn{text-decoration:line-through;}
.mck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--b);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;font-weight:700;color:var(--at);transition:all .15s;}
.mtn{flex:1;line-height:1.4;word-break:break-word;}
.mdel{border:none;background:none;color:var(--t4);cursor:pointer;font-size:18px;padding:0;opacity:0;transition:opacity .15s;flex-shrink:0;}
.mtask:hover .mdel,.mtask:active .mdel{opacity:1;}

.modal-add{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 20px 32px;border-top:1px solid var(--b2);background:var(--s1);}
.modal-input{flex:1;border:none;background:var(--s2);border-radius:10px;font-family:inherit;font-size:14px;color:var(--t);padding:11px 14px;outline:none;}
.modal-input::placeholder{color:var(--t3);}
.modal-add-btn{background:var(--a);color:var(--at);border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;padding:11px 18px;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* ── WEEK ── */
.week-sum{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  border:1px solid var(--b);border-radius:14px;overflow:hidden;margin-bottom:20px;
}
.wsb{background:var(--s1);padding:14px 10px;text-align:center;border-right:1px solid var(--b2);}
.wsb:last-child{border-right:none;}
.wsb .n{font-size:22px;font-weight:300;color:var(--t);display:block;margin-bottom:4px;line-height:1;}
.wsb .l{font-size:8px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;display:block;}

/* Week day rows — vertical list */
.week-list{display:flex;flex-direction:column;gap:8px;}

.wday-row{
  background:var(--s1);border:1px solid var(--b);border-radius:16px;
  padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.wday-row:active{transform:scale(.98);background:var(--s2);}
.wday-row.today{border-color:var(--a);}
.wday-row.today{background:var(--s2);}

/* Mini ring */
.wrow-ring{width:48px;height:48px;flex-shrink:0;position:relative;}
.wrow-ring svg{width:48px;height:48px;transform:rotate(-90deg);display:block;}
.wrow-ring-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--t);
}

/* Day info */
.wrow-info{flex:1;min-width:0;}
.wrow-name{
  font-size:13px;font-weight:700;color:var(--t);
  display:flex;align-items:center;gap:8px;margin-bottom:3px;
}
.wrow-name .today-badge{
  font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--a);background:rgba(201,255,63,.1);
  padding:2px 7px;border-radius:99px;border:1px solid rgba(201,255,63,.2);
}
.wrow-date{font-size:11px;color:var(--t3);}
.wrow-tasks{font-size:11px;color:var(--t3);margin-top:2px;}
.wrow-tasks .done{color:var(--a);font-weight:600;}

/* Right arrow */
.wrow-arr{
  font-size:18px;color:var(--t3);flex-shrink:0;
  transition:transform .15s;
}
.wday-row:active .wrow-arr{transform:translateX(3px);}

/* Task preview dots */
.wrow-dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.wrow-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}

/* ── ANXIETY ── */
.anx-intro{background:var(--s1);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:12px;}
.anx-intro h2{font-size:18px;font-weight:300;margin-bottom:8px;color:var(--t);}
.anx-intro p{font-size:12px;color:var(--t2);line-height:1.9;font-weight:300;}
.anx-intro p b{color:var(--a);font-weight:600;}
.aform{background:var(--s1);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:12px;}
.af{margin-bottom:15px;}
.afl{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);margin-bottom:7px;display:block;}
.afx{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:11px 13px;color:var(--t);font-family:inherit;font-size:13px;font-weight:300;outline:none;resize:none;line-height:1.65;transition:border-color .15s;}
.afx:focus{border-color:var(--a);}
.afx::placeholder{color:var(--t3);}
.lvls{display:flex;gap:3px;}
.lv{flex:1;border:1px solid var(--b);border-radius:7px;background:var(--s2);color:var(--t3);font-family:inherit;font-size:10px;font-weight:600;padding:8px 2px;cursor:pointer;text-align:center;transition:all .15s;}
.lv.on{color:#111;font-weight:700;}
.abtn{width:100%;background:var(--a);color:var(--at);border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;padding:14px;cursor:pointer;margin-top:4px;}
.ae{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:17px;margin-bottom:8px;}
.ae-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px;}
.ae-th{font-size:14px;font-weight:400;line-height:1.5;flex:1;padding-right:10px;color:var(--t);}
.ae-bx{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.ae-sp{height:1px;background:var(--b2);margin:11px 0;}
.ae-ql{font-size:8px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);margin-bottom:4px;}
.ae-qa{font-size:13px;color:var(--t2);line-height:1.6;font-weight:300;}
.ae-ft{display:flex;justify-content:space-between;align-items:center;margin-top:11px;}
.ae-tm{font-size:10px;color:var(--t3);}
.ae-dl{border:none;background:none;color:var(--t3);cursor:pointer;font-size:11px;font-family:inherit;}

/* ── STATS ── */
/* ── STATS NEW ── */
/* Hero ring block */
.st-hero{display:flex;align-items:center;gap:18px;background:var(--s1);border:1px solid var(--b);border-radius:20px;padding:20px 18px;margin-bottom:14px;}
.st-ring-wrap{position:relative;flex-shrink:0;width:84px;height:84px;}
.st-ring-wrap svg{transform:rotate(-90deg);}
.st-ring-bg{fill:none;stroke:var(--s3);stroke-width:7;}
.st-ring-fg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1),stroke .5s;}
.st-ring-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.st-ring-pct .pv{font-size:18px;font-weight:700;line-height:1;color:var(--t);}
.st-ring-pct .pl{font-size:7.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-top:1px;}
.st-hero-info{flex:1;min-width:0;}
.st-hero-title{font-size:15px;font-weight:700;color:var(--t);margin-bottom:2px;}
.st-hero-sub{font-size:11px;color:var(--t3);line-height:1.5;margin-bottom:10px;}
.st-chips{display:flex;flex-wrap:wrap;gap:6px;}
.st-chip{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;border:1px solid var(--b);font-size:10px;font-weight:600;color:var(--t2);background:var(--s2);}
.st-chip-dot{width:5px;height:5px;border-radius:50%;background:var(--a);}

/* Mini stat grid */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.sb{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:15px 8px;text-align:center;position:relative;overflow:hidden;}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--a);opacity:0;transition:opacity .3s;}
.sb.hi::before{opacity:1;}
.sb .n{font-size:22px;font-weight:300;letter-spacing:-.5px;line-height:1;margin-bottom:5px;color:var(--t);}
.sb .l{font-size:8.5px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;}

/* Bar chart */
.bch-wrap{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:16px 14px 12px;margin-bottom:14px;}
.bch-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.bch-ttl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);}
.bch-avg{font-size:10px;font-weight:600;color:var(--a);}
.bch{display:flex;align-items:flex-end;gap:5px;height:80px;}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;height:100%;}
.bo{flex:1;width:100%;background:var(--s3);border-radius:5px;overflow:hidden;display:flex;align-items:flex-end;}
.bf{width:100%;border-radius:5px;transition:height .8s ease;}
.bch-labels{display:flex;gap:5px;margin-top:7px;}
.bc-lbl{flex:1;text-align:center;font-size:8px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;}
.bc.tod .bc-lbl{color:var(--a);}
.bc.tod .bo{outline:1.5px solid var(--a);outline-offset:-1px;}

/* Category rows */
.bdrows{display:flex;flex-direction:column;gap:10px;}
.bdr{background:var(--s1);border:1px solid var(--b);border-radius:14px;padding:12px 14px;}
.bdr-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bdd{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.bdn{flex:1;font-size:12px;font-weight:600;color:var(--t);}
.bdc{font-size:11px;font-weight:700;color:var(--t3);}
.bdb{width:100%;height:5px;background:var(--s3);border-radius:99px;overflow:hidden;}
.bdf{height:100%;border-radius:99px;transition:width .8s ease;}

/* Insights */
.ilist{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;}
.ii{background:var(--s1);border:1px solid var(--b);border-radius:16px;padding:14px 15px;display:flex;gap:12px;align-items:flex-start;transition:transform .15s;}
.ii:active{transform:scale(.98);}
.ii-ico-wrap{width:34px;height:34px;border-radius:10px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.iii{font-size:16px;line-height:1;}
.ii-body{flex:1;min-width:0;}
.iit{font-size:13px;font-weight:600;margin-bottom:2px;color:var(--t);}
.iib{font-size:11.5px;color:var(--t2);line-height:1.6;font-weight:300;}
.ii-badge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:5px;}

/* Heatmap row */
.st-hm{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;}
.st-hm-cell{width:calc((100% - 18px)/7);aspect-ratio:1;border-radius:4px;background:var(--s3);transition:background .4s;}

/* Trend line micro */
.st-trend{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:10px;}
.st-trend-b{flex:1;border-radius:3px 3px 0 0;background:var(--s3);transition:height .6s ease,background .4s;}
/* old bar/category rules superseded by new stats CSS above */

/* ── PROFILE ── */
.card{background:var(--s1);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:10px;}
.av-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
.av{width:62px;height:62px;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;cursor:pointer;position:relative;overflow:hidden;}
#avem{color:var(--t3);display:flex;align-items:center;justify-content:center;}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
.av-ov{position:absolute;inset:0;background:rgba(0,0,0,.0);display:none;align-items:center;justify-content:center;}
#avem svg{transition:color .2s,filter .2s;}
.av:hover #avem svg,.av:active #avem svg{color:var(--a);filter:drop-shadow(0 0 6px var(--a));}

.av-info{flex:1;padding-top:4px;}
.pni{font-size:20px;font-weight:300;color:var(--t);background:none;border:none;outline:none;border-bottom:1px solid transparent;padding:2px 0;width:100%;font-family:inherit;transition:border-color .15s;}
.pni:focus{border-bottom-color:var(--a);}
.pni::placeholder{color:var(--t3);}
.psub{font-size:10px;color:var(--t3);margin-top:4px;}
.pbio{width:100%;background:none;border:none;outline:none;border-bottom:1px solid var(--b);color:var(--t2);font-family:inherit;font-size:13px;font-weight:300;padding:4px 0;resize:none;line-height:1.6;transition:border-color .15s;}
.pbio:focus{border-bottom-color:var(--a);}
.pbio::placeholder{color:var(--t3);}
.pst{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--b);border-radius:12px;overflow:hidden;margin-top:16px;}
.ps{background:var(--s1);padding:12px 8px;text-align:center;}
.ps .n{font-size:19px;font-weight:300;line-height:1;margin-bottom:4px;color:var(--t);}
.ps .l{font-size:8px;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;}
.wdots{display:flex;gap:5px;margin-top:10px;}
.wd{flex:1;height:5px;border-radius:99px;background:var(--s3);}
.wd.on{background:var(--a);}
.wd.half{background:var(--a);opacity:.3;}
.grow{display:flex;gap:8px;}
.gi{flex:1;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px 12px;color:var(--t);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;}
.gi:focus{border-color:var(--a);}
.gi::placeholder{color:var(--t3);}
.gs{background:var(--a);color:var(--at);border:none;border-radius:10px;font-family:inherit;font-size:11px;font-weight:700;padding:10px 15px;cursor:pointer;white-space:nowrap;}
.gdis{margin-top:10px;padding:11px 13px;background:var(--s2);border-radius:10px;border-left:2px solid var(--a);font-size:13px;font-weight:300;color:var(--t2);line-height:1.6;display:none;}

/* ── SETTINGS ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sh{background:var(--s1);border:1px solid var(--b);border-radius:22px 22px 0 0;padding:22px 20px 48px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;animation:mup .2s ease;}
.sh-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sh-tt{font-size:17px;font-weight:300;color:var(--t);}
.shx{border:none;background:var(--s2);border-radius:7px;width:28px;height:28px;cursor:pointer;color:var(--t2);font-size:14px;display:flex;align-items:center;justify-content:center;}
.sg{margin-bottom:20px;}
.sgl{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);margin-bottom:9px;}
.trow{display:flex;gap:8px;}
.to{flex:1;border:1px solid var(--b);border-radius:10px;background:var(--s2);color:var(--t3);font-family:inherit;font-size:13px;padding:11px;cursor:pointer;text-align:center;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;}
.to.on{border-color:var(--a);color:var(--t);background:var(--s1);}
.swr{display:flex;flex-wrap:wrap;gap:8px;}
.sw{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s;}
.sw:hover,.sw:active{transform:scale(1.1);}
.sw.on{border-color:var(--t);}
.crows{display:flex;flex-direction:column;gap:11px;}
.crow{display:flex;align-items:center;gap:10px;}
.crn{font-size:13px;font-weight:400;width:80px;flex-shrink:0;color:var(--t);}
.csws{display:flex;gap:5px;flex-wrap:wrap;}
.csw{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:transform .15s;}
.csw:hover,.csw:active{transform:scale(1.1);}
.csw.on{border-color:var(--t);}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--t);color:var(--bg);font-size:12px;font-weight:600;letter-spacing:.3px;padding:10px 20px;border-radius:99px;z-index:400;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
#avf{display:none;}

@media(max-width:360px){
  .week-days{grid-template-columns:1fr;}
  .stat-box .v{font-size:17px;}
}

.particle{
  position:absolute;

  opacity:1;
}
@keyframes particle-fly{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}
}

.energy-text{

  0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}
  40%{transform:translate(-50%,-80%) scale(1.1);opacity:1;}
  70%{transform:translate(-50%,-110%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-140%) scale(.8);opacity:0;}

  30%{transform:translate(-50%,-60%) scale(1.1);opacity:1;}
  70%{transform:translate(-50%,-80%) scale(1);opacity:1;}

// TODAY RING — animated segments, each task = colored arc
var _ringPrevDone=0;
function ring(tasks){
  var svgEl=document.getElementById('rsvg');
  var rw=document.querySelector('.rw');
  var cx=80,cy=80,r=64,sw=10,C=2*Math.PI*r;
  var tot=tasks.length,dn=tasks.filter(function(t){return t.done;}).length;
  var pct=tot?Math.round(dn/tot*100):0;
  var svgNS='http://www.w3.org/2000/svg';

  document.getElementById('rpct').textContent=tot?pct+'%':'—';
  var l=L();
  var rr=!tot?l.r0:pct===0?l.r1:pct<40?l.r2:pct<70?l.r3:pct<100?l.r4:l.r5;
  document.getElementById('rlbl').textContent=rr;
  document.getElementById('hd').textContent=dn;
  document.getElementById('ht').textContent=tot;
  document.getElementById('hl').textContent=tot-dn;

  if(rw){
    rw.classList.toggle('has-tasks',tot>0);
    rw.classList.toggle('no-tasks',tot===0);
  }

  // Задача выполнена — пульс кольца + glow
  var justDone=(dn>_ringPrevDone&&_ringPrevDone>=0);
  _ringPrevDone=dn;
  if(justDone&&rw){
    rw.classList.remove('ring-celebrate');
    void rw.offsetWidth;
    rw.classList.add('ring-celebrate');
    setTimeout(function(){rw.classList.remove('ring-celebrate');},600);
    // Цветной ореол при выполнении
    var lastDoneTask=null;
    tasks.forEach(function(t){if(t.done)lastDoneTask=t;});
    if(lastDoneTask){
      var glowCol=gc(lastDoneTask.cat).c;
      var glowEl=document.createElement('div');
      glowEl.className='rw-glow';
      glowEl.style.cssText='border:3px solid '+glowCol+';box-shadow:0 0 32px '+glowCol+',0 0 64px '+rg(glowCol,.3)+';';
      rw.appendChild(glowEl);
      setTimeout(function(){glowEl.remove();},750);
    }
    if(pct===100){
      // Конфетти / искры при 100%
      var cRect=rw.getBoundingClientRect();
      burstParticles(cRect.left+cRect.width/2,cRect.top+cRect.height/2,tasks.length>0?gc(tasks[dn-1].cat).c:S.accent);
    }
  }

  if(!tot){
    document.getElementById('rpct').style.display='none';
    document.getElementById('rlbl').style.display='none';
    var rc2=document.querySelector('.rc');
    var emptyArc=(C*0.2).toFixed(1);
    svgEl.innerHTML=
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--s3)" stroke-width="'+sw+'"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+S.accent+'" stroke-width="'+sw
      +'" stroke-dasharray="'+emptyArc+' '+(C-parseFloat(emptyArc)).toFixed(1)
      +'" stroke-linecap="round" transform="rotate(-90 '+cx+' '+cy+')" class="ring-empty-arc"/>';
    if(rc2&&!rc2.querySelector('.ring-empty-hint')){
      var hint=document.createElement('div');
      hint.className='ring-empty-hint';
      hint.innerHTML='<span>'+(S.lang==='ru'?'добавь задачи':'add tasks')+'</span>';
      rc2.appendChild(hint);
    }
    return;
  }

  document.getElementById('rpct').style.display='';
  document.getElementById('rlbl').style.display='';
  var oldHint=document.querySelector('.ring-empty-hint');
  if(oldHint)oldHint.remove();

  // Строю SVG — каждая задача = сегмент кольца с gap
  var GAP=tot>1?(6/360)*C:0;
  var seg=(C-GAP*tot)/tot;
  var h='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--s3)" stroke-width="'+sw+'"/>';

  // Внутренний трек — полупрозрачный
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--s3)" stroke-width="'+(sw+2)+'" opacity=".3"/>';

  tasks.forEach(function(t,i){
    var cat=gc(t.cat);
    // Выполнена — яркий цвет + glow; нет — тёмный
    var col=t.done?cat.c:rg(cat.c,.15);
    var glowFilter=t.done?'filter:drop-shadow(0 0 6px '+rg(cat.c,.8)+')':'';
    var o=-(i*(seg+GAP));
    // Анимация заливки: если задача выполнена — дуга = seg, если нет = минимум
    var arcLen=t.done?seg.toFixed(1):'0.5';
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r
      +'" fill="none" stroke="'+col
      +'" stroke-width="'+(t.done?sw:sw-2)
      +'" stroke-dasharray="'+seg.toFixed(1)+' '+(C-seg).toFixed(1)
      +'" stroke-dashoffset="'+o.toFixed(1)
      +'" stroke-linecap="'+(tot===1?'round':'butt')+'"'
      +' style="transition:stroke .55s ease,stroke-width .4s ease,opacity .4s ease;opacity:'+(t.done?1:.35)+';"/>';
    // Яркий оверлей поверх для выполненного сегмента
    if(t.done){
      h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r
        +'" fill="none" stroke="'+cat.c
        +'" stroke-width="'+(sw+1)
        +'" stroke-dasharray="'+(seg*.85).toFixed(1)+' '+(C-seg*.85).toFixed(1)
        +'" stroke-dashoffset="'+(o-seg*.075).toFixed(1)
        +'" stroke-linecap="butt"'
        +' style="opacity:.4;mix-blend-mode:screen;transition:opacity .55s ease;"/>';
    }
  });


  svgEl.innerHTML=h;
}

function burstParticles(x,y,col){
  var pc=document.getElementById('particle-container');if(!pc)return;
  for(var i=0;i<14;i++){
    var p=document.createElement('div');
    var sz=Math.random()*6+3;
    var ang=Math.random()*360;
    var dist=60+Math.random()*80;
    var dx=Math.cos(ang*Math.PI/180)*dist;
    var dy=Math.sin(ang*Math.PI/180)*dist-30;
    p.className='particle';
    p.style.cssText='width:'+sz+'px;height:'+sz+'px;background:'+(Math.random()>.5?col:S.accent)+';left:'+x+'px;top:'+y+'px;--dx:'+dx+'px;--dy:'+dy+'px;--dur:'+(0.5+Math.random()*.5)+'s;';
    pc.appendChild(p);
    setTimeout(function(el){el.remove();},900,p);
  }
}

// WEEK
function getWT(k){return S.wt[k]||[];}
function addWT(k,txt,cat){if(!txt.trim())return;if(!S.wt[k])S.wt[k]=[];S.wt[k].push({id:Date.now(),text:txt.trim(),cat:cat||'work',done:false});sv();}
function togWT(k,id){var t=(S.wt[k]||[]).find(function(x){return x.id===id;});if(!t)return;t.done=!t.done;sv();}
function delWT(k,id){S.wt[k]=(S.wt[k]||[]).filter(function(x){return x.id!==id;});sv();}

function rWeek(){
  var l=L(),keys=wkeys(),todK=tk(),mon=getMon();
  var wtot=0,wdn=0;
  keys.forEach(function(k){
    var ts=getWT(k);wtot+=ts.length;
    wdn+=ts.filter(function(t){return t.done;}).length;
  });
  document.getElementById('ws1').textContent=wtot;
  document.getElementById('ws2').textContent=wdn;
  document.getElementById('ws3').textContent=wtot?Math.round(wdn/wtot*100)+'%':'0%';

  var list=document.getElementById('week-list');
  list.innerHTML='';

  keys.forEach(function(dayKey,i){
    var d=new Date(mon);d.setDate(mon.getDate()+i);
    var tasks=getWT(dayKey),isToday=(dayKey===todK);
    // Today's ring shows today's tasks from main tracker
    var ringTasks=isToday?(S.tasks[dayKey]||[]).concat(tasks):tasks;
    var dn=ringTasks.filter(function(t){return t.done;}).length,tot=ringTasks.length;
    var dispDn=tasks.filter(function(t){return t.done;}).length,dispTot=tasks.length;
    var pct=tot?Math.round(dn/tot*100):0;

    var row=document.createElement('div');
    row.className='wday-row'+(isToday?' today':'');

    // ── Mini ring ──
    var rDiv=document.createElement('div');rDiv.className='wrow-ring';
    var svgNS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 48 48');
    var cx=24,cy=24,r=19,sw=4,C=2*Math.PI*r;
    // bg circle
    var bgC=document.createElementNS(svgNS,'circle');
    bgC.setAttribute('cx',cx);bgC.setAttribute('cy',cy);bgC.setAttribute('r',r);
    bgC.setAttribute('fill','none');bgC.setAttribute('stroke','var(--s3)');bgC.setAttribute('stroke-width',sw);
    svg.appendChild(bgC);
    if(tot===0){
      // spinning hint arc
      var arcL=(C*0.25).toFixed(1);
      var spinC=document.createElementNS(svgNS,'circle');
      spinC.setAttribute('cx',cx);spinC.setAttribute('cy',cy);spinC.setAttribute('r',r);
      spinC.setAttribute('fill','none');spinC.setAttribute('stroke',S.accent);spinC.setAttribute('stroke-width',sw);
      spinC.setAttribute('stroke-dasharray',arcL+' '+(C-parseFloat(arcL)));
      spinC.setAttribute('stroke-linecap','round');
      spinC.setAttribute('opacity','0.4');
      spinC.setAttribute('class','ring-spin-arc');
      spinC.style.transformOrigin=cx+'px '+cy+'px';
      svg.appendChild(spinC);
    } else {
      var arc=C*(dn/tot);
      var fgC=document.createElementNS(svgNS,'circle');
      fgC.setAttribute('cx',cx);fgC.setAttribute('cy',cy);fgC.setAttribute('r',r);
      fgC.setAttribute('fill','none');fgC.setAttribute('stroke',S.accent);fgC.setAttribute('stroke-width',sw);
      fgC.setAttribute('stroke-dasharray',arc.toFixed(1)+' '+(C-arc).toFixed(1));
      fgC.setAttribute('stroke-linecap','round');
      svg.appendChild(fgC);
    }
    rDiv.appendChild(svg);
    // pct text
    var pctDiv=document.createElement('div');pctDiv.className='wrow-ring-pct';
    pctDiv.textContent=tot?(dn===tot?'✓':pct+'%'):'';
    if(dn===tot&&tot>0)pctDiv.style.color=S.accent;
    rDiv.appendChild(pctDiv);
    row.appendChild(rDiv);

    // ── Info ──
    var info=document.createElement('div');info.className='wrow-info';

    var nameRow=document.createElement('div');nameRow.className='wrow-name';
    nameRow.textContent=l.DF[d.getDay()];
    if(isToday){
      var badge=document.createElement('span');badge.className='today-badge';
      badge.textContent=S.lang==='ru'?'сегодня':'today';
      nameRow.appendChild(badge);
    }
    info.appendChild(nameRow);

    var dateEl=document.createElement('div');dateEl.className='wrow-date';
    dateEl.textContent=d.getDate()+' '+l.MNf[d.getMonth()];
    info.appendChild(dateEl);

    // task summary
    var tsEl=document.createElement('div');tsEl.className='wrow-tasks';
    if(!tot){
      tsEl.textContent=S.lang==='ru'?'Нет задач — нажми чтобы добавить':'No tasks — tap to add';
    } else {
      tsEl.innerHTML='<span class="done">'+dn+'</span> из '+tot+' '+(S.lang==='ru'?'выполнено':'done');
    }
    info.appendChild(tsEl);

    // task color dots
    if(tot>0){
      var dots=document.createElement('div');dots.className='wrow-dots';
      tasks.slice(0,8).forEach(function(t){
        var dot=document.createElement('div');dot.className='wrow-dot';
        var cat=gc(t.cat);
        dot.style.background=t.done?cat.c:'var(--s3)';
        dots.appendChild(dot);
      });
      if(tasks.length>8){
        var more=document.createElement('span');
        more.style.cssText='font-size:9px;color:var(--t3);';
        more.textContent='+'+( tasks.length-8);
        dots.appendChild(more);
      }
      info.appendChild(dots);
    }

    row.appendChild(info);

    // arrow
    var arr=document.createElement('div');arr.className='wrow-arr';arr.textContent='›';
    row.appendChild(arr);

    (function(dk,di){row.onclick=function(){openModal(dk,di,mon);};})(dayKey,i);
    list.appendChild(row);
  });
}

// STATS
function rStats(){
  var l=L(),keys=wkeys(),todK=tk(),mon=getMon();
  var ru=S.lang==='ru';
  var tot=0,dn=0,cm={};
  S.cats.forEach(function(c){cm[c.id]={t:0,d:0};});

  var dps=keys.map(function(k){
    var ts=(S.tasks[k]||[]).concat(S.wt[k]||[]);
    var d=ts.filter(function(t){return t.done;}).length;
    tot+=ts.length;dn+=d;
    ts.forEach(function(t){if(t.cat&&cm[t.cat]){cm[t.cat].t++;if(t.done)cm[t.cat].d++;}});
    return ts.length?Math.round(d/ts.length*100):0;
  });
  var pct=tot?Math.round(dn/tot*100):0;

  // ── Streak
  var streak=0;
  for(var si=keys.length-1;si>=0;si--){
    var sk=keys[si];var sts=(S.tasks[sk]||[]).concat(S.wt[sk]||[]);
    if(sts.filter(function(t){return t.done;}).length>0)streak++;
    else if(si<keys.length-1)break;
  }

  // ── Лучший день недели
  var dayTotals=new Array(7).fill(0),dayCounts=new Array(7).fill(0);
  keys.forEach(function(k,i){var d=new Date(mon);d.setDate(mon.getDate()+i);var dow=d.getDay();var ts2=(S.tasks[k]||[]).concat(S.wt[k]||[]);if(ts2.length){dayTotals[dow]+=dps[i];dayCounts[dow]++;}});
  var bestDow=-1,bestDowPct=0;
  for(var di2=0;di2<7;di2++){if(dayCounts[di2]>0){var avgDow=dayTotals[di2]/dayCounts[di2];if(avgDow>bestDowPct){bestDowPct=avgDow;bestDow=di2;}}}

  // ── Средний КПД в активные дни
  var activeDays=dps.filter(function(p){return p>0;});
  var avgActive=activeDays.length?Math.round(activeDays.reduce(function(s,p){return s+p;},0)/activeDays.length):0;

  // ── Тренд: первая половина vs вторая
  var half=Math.floor(dps.length/2);
  var firstHalf=dps.slice(0,half),secHalf=dps.slice(half);
  var fAvg=firstHalf.length?firstHalf.reduce(function(s,p){return s+p;},0)/firstHalf.length:0;
  var sAvg=secHalf.length?secHalf.reduce(function(s,p){return s+p;},0)/secHalf.length:0;
  var trendUp=sAvg>fAvg+5,trendDn=sAvg<fAvg-5;

  // ══ HERO RING ══
  var CIRC=2*Math.PI*36;
  var ringFg=document.getElementById('st-ring-fg');
  var ringColor=pct>=80?S.accent:pct>=50?rg(S.accent,.75):pct>=25?rg(S.accent,.45):'var(--t3)';
  if(ringFg){
    ringFg.setAttribute('stroke',ringColor);
    setTimeout(function(){ringFg.setAttribute('stroke-dasharray',Math.round(pct/100*CIRC)+' '+CIRC);},80);
  }
  document.getElementById('st-pct-v').textContent=pct+'%';
  document.getElementById('st-pct-l').textContent=ru?'неделя':'week';

  var heroTitle='',heroSub='';
  if(!tot){heroTitle=ru?'Пока нет данных':'No data yet';heroSub=ru?'Добавь первую задачу':'Add your first task';}
  else if(pct>=80){heroTitle=ru?'Отличная неделя 🔥':'Stellar week 🔥';heroSub=ru?'Ты выполняешь '+pct+'% задач. Продолжай в том же духе!':'You\'re completing '+pct+'% of tasks. Keep the momentum!';}
  else if(pct>=50){heroTitle=ru?'Хороший прогресс 💪':'Good progress 💪';heroSub=ru?pct+'% выполнено. До отличного результата совсем немного.':pct+'% done. Just a bit more to reach an excellent result.';}
  else if(pct>=25){heroTitle=ru?'Ты разгоняешься 📈':'You\'re building up 📈';heroSub=ru?pct+'% выполнено. Каждый день на счёту.':pct+'% done. Every day counts.';}
  else{heroTitle=ru?'Начало пути 🌱':'Just getting started 🌱';heroSub=ru?'Маленькие шаги ведут к большому результату.':'Small steps lead to big results.';}
  document.getElementById('st-htitle').textContent=heroTitle;
  document.getElementById('st-hsub').textContent=heroSub;

  var chips=[];
  if(streak>=2)chips.push({dot:S.accent,txt:(ru?'🔗 '+streak+' дн. серия':'🔗 '+streak+' day streak')});
  if(trendUp)chips.push({dot:'#4ade80',txt:(ru?'↑ растёт':'↑ trending up')});
  else if(trendDn)chips.push({dot:'#f87171',txt:(ru?'↓ падает':'↓ trending down')});
  if(avgActive>=70)chips.push({dot:rg(S.accent,.7),txt:(ru?'⚡ '+avgActive+'% КПД':'⚡ '+avgActive+'% avg eff.')});
  document.getElementById('st-chips').innerHTML=chips.map(function(c){
    return '<div class="st-chip"><div class="st-chip-dot" style="background:'+c.dot+'"></div>'+c.txt+'</div>';
  }).join('');

  // ══ MINI METRICS ══
  document.getElementById('an1').textContent=tot;
  document.getElementById('an2').textContent=dn;
  document.getElementById('an3').textContent=tot?pct+'%':'—';
  ['sb1','sb2','sb3'].forEach(function(id){document.getElementById(id).classList.remove('hi');});
  if(pct>=75)document.getElementById('sb3').classList.add('hi');
  if(dn>0)document.getElementById('sb2').classList.add('hi');

  // ══ BAR CHART ══
  var mp=Math.max.apply(null,dps.concat([1]));
  var avgLine=activeDays.length?Math.round(activeDays.reduce(function(s,p){return s+p;},0)/activeDays.length):0;
  if(document.getElementById('sdy')&&!document.getElementById('sdy').textContent)document.getElementById('sdy').textContent=(ru?'По дням':'By day');
  if(document.getElementById('bch-avg-lbl'))document.getElementById('bch-avg-lbl').textContent=avgLine?(ru?'∅ '+avgLine+'%':'avg '+avgLine+'%'):'';
  document.getElementById('bch').innerHTML=keys.map(function(k,i){
    var p=dps[i];
    var col=p>=80?S.accent:p>=50?rg(S.accent,.65):p>=20?rg(S.accent,.35):p>0?rg(S.accent,.18):'';
    var h=Math.round(p/mp*100);
    var shadow=p>=80?'box-shadow:0 0 8px '+rg(S.accent,.4)+';':'';
    return '<div class="bc'+(k===todK?' tod':'')+'"><div class="bo">'+(h?'<div class="bf" style="height:0;background:'+col+';'+shadow+'" data-h="'+h+'%"></div>':'')+'</div></div>';
  }).join('');
  document.getElementById('blbls').innerHTML=keys.map(function(k,i){var d=new Date(mon);d.setDate(mon.getDate()+i);return '<div class="bc-lbl" style="'+(k===todK?'color:'+S.accent:'')+'">'+l.DS[d.getDay()]+'</div>';}).join('');

  // ══ CATEGORIES ══
  var ac=S.cats.filter(function(c){return cm[c.id]&&cm[c.id].t>0;}).sort(function(a,b){return cm[b.id].t-cm[a.id].t;});
  document.getElementById('bdrows').innerHTML=ac.length?ac.map(function(c){
    var rate=cm[c.id].t?Math.round(cm[c.id].d/cm[c.id].t*100):0;
    var barW=rate;
    var rateCol=rate>=75?c.c:rate>=40?rg(c.c,.7):rg(c.c,.4);
    return '<div class="bdr"><div class="bdr-top"><div class="bdd" style="background:'+c.c+'"></div><div class="bdn">'+cl(c.id)+'</div><div class="bdc" style="color:'+rateCol+'">'+cm[c.id].d+'/'+cm[c.id].t+' <span style="opacity:.6;font-weight:400">('+rate+'%)</span></div></div><div class="bdb"><div class="bdf" style="width:0;background:'+c.c+';opacity:.85;transition:width .65s cubic-bezier(.4,0,.2,1)" data-w="'+barW+'%"></div></div></div>';
  }).join(''):'<div class="empty"><div class="et">'+l.noD+'</div></div>';

  // ══ INSIGHTS ══
  var ins=[];
  if(!tot){ins.push({i:'📋',t:l.i0[0],b:l.i0[1],badge:''});}
  else{
    if(pct>=80)ins.push({i:'🔥',t:(ru?'Топ-результат':'Top result'),b:(ru?pct+'% выполнено за эту неделю. Ты в отличной форме!':pct+'% done this week. You\'re on fire!'),badge:(ru?'Отлично':'Excellent')});
    else if(pct>=50)ins.push({i:'💪',t:l.i75[0],b:pct+l.i75[1],badge:''});
    else if(pct>=25)ins.push({i:'📈',t:l.i45[0],b:pct+l.i45[1],badge:''});
    else ins.push({i:'🌱',t:l.iL[0],b:l.iL[1],badge:''});

    if(streak>=3)ins.push({i:'⚡',t:(ru?'Серия '+streak+' дней подряд':''+streak+'-day streak'),b:(ru?'Ты занимаешься каждый день. Это формирует привычку!':'You\'ve been going every single day. That\'s how habits form!'),badge:(streak>=5?(ru?'🏆 Рекорд':'🏆 Record'):'')});
    else if(streak>=2)ins.push({i:'⚡',t:(ru?'Серия '+streak+' дня':''+streak+' days running'),b:(ru?'Два дня подряд — хорошее начало. Не останавливайся!':'Two days in a row — great start. Don\'t stop now!'),badge:''});

    if(trendUp)ins.push({i:'📊',t:(ru?'Ты растёшь':'Upward trend'),b:(ru?'Вторая половина недели лучше первой. Динамика позитивная!':'Your second half beats the first. Great momentum!'),badge:(ru?'↑ Рост':'↑ Rising')});
    else if(trendDn)ins.push({i:'📉',t:(ru?'Темп снизился':'Pace slowing down'),b:(ru?'В начале недели было лучше. Попробуй восстановить ритм.':'You started stronger. Try to get back into rhythm.'),badge:''});

    if(bestDow>=0&&bestDowPct>=40)ins.push({i:'📅',t:(ru?'Сильный день — '+l.DF[bestDow]:l.DF[bestDow]+' is your power day'),b:(ru?'Средний результат '+Math.round(bestDowPct)+'%. Планируй важное на этот день.':'Avg '+Math.round(bestDowPct)+'% completion. Stack your key tasks here.'),badge:''});

    var size=Math.max(rect.width,rect.height);
    r.style.cssText='width:'+size+'px;height:'+size+'px;left:'+((evt.clientX-rect.left)-size/2)+'px;top:'+((evt.clientY-rect.top)-size/2)+'px;';

  var _acc=document.getElementById('access-screen');

  (function(){

  try{applyTheme();}catch(e){}
  try{applyLang();}catch(e){}
  try{rCats();rNasCats();rFtgateCats();rToday();rLvls();}catch(e){}
  try{initN();initReminder();}catch(e){}
  try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')schedN();}catch(e){}

  // 4. После сплеша — показываем нужный экран
  setTimeout(function(){
    var sp=document.getElementById('sp');
    if(sp)sp.classList.add('out');
    setTimeout(function(){
      if(sp){sp.style.display='none';sp.style.visibility='hidden';}
      var _authorized=false;
      try{var s=localStorage.getItem('clarity_access');_authorized=!!(s&&ACCESS_CODES.indexOf(s)!==-1);}catch(e){}

        var screen=document.getElementById('access-screen');

    },500);
  },1800);
}

var activeTutorial=null;
var tutStep=0;

function showTutorial(tab){
  var key='tut_done_'+tab;
  if(localStorage.getItem(key)==='1')return;
  var data=TUTORIALS[tab];
  if(!data)return;
  activeTutorial=tab;
  tutStep=0;
  var el=document.getElementById('tab-tutorial');
  el.style.display='flex';
  renderTutorial();
}

function renderTutorial(){
  if(!activeTutorial)return;
  var lang=S.lang==='ru'?'ru':'en';
  var steps=TUTORIALS[activeTutorial][lang];
  if(!steps||tutStep>=steps.length){tutorialDone();return;}
  var s=steps[tutStep];
  document.getElementById('tut-step').textContent=s.step;
  document.getElementById('tut-title').textContent=s.title;
  document.getElementById('tut-desc').innerHTML=s.desc;
  var isLast=tutStep>=steps.length-1;
  document.getElementById('tut-btn').textContent=isLast?(S.lang==='ru'?'Понятно!':'Got it!'):(S.lang==='ru'?'Далее →':'Next →');
  var skipBtn=document.getElementById('tut-skip');
  if(skipBtn)skipBtn.textContent=S.lang==='ru'?'Пропустить':'Skip';
}

function tutNext(){
  var lang=S.lang==='ru'?'ru':'en';
  var steps=TUTORIALS[activeTutorial][lang];
  if(tutStep<steps.length-1){tutStep++;renderTutorial();}
  else tutorialDone();
}

function tutorialDone(){
  if(activeTutorial) localStorage.setItem('tut_done_'+activeTutorial,'1');
  activeTutorial=null;
  var el=document.getElementById('tab-tutorial');
  el.style.opacity='0';
  setTimeout(function(){el.style.display='none';el.style.opacity='1';},300);
}

// ── TASK REMINDERS ──────────────────────────────────────────────────
var _reminderTimer = null;

function showReminder(title, sub){
  var el=document.getElementById('task-reminder');
  document.getElementById('tr-title').textContent=title;
  document.getElementById('tr-sub').textContent=sub;
  el.classList.add('show');
  clearTimeout(_reminderTimer);
  _reminderTimer=setTimeout(function(){closeReminder();},4500);
}

function closeReminder(){
  document.getElementById('task-reminder').classList.remove('show');
}

function checkTaskReminder(){
  var k=tk(), ts=S.tasks[k]||[];
  if(!ts.length) return;
  var dn=ts.filter(function(t){return t.done;}).length;
  var left=ts.length-dn;
  var l=L();
  if(left>0){
    var title=S.lang==='ru'
      ?'У тебя '+left+' '+(left===1?'задача':'задач')+' на сегодня'
      :left+' task'+(left>1?'s':'')+' remaining today';
    var pct=Math.round(dn/ts.length*100);
    var sub=S.lang==='ru'
      ?'Выполнено '+pct+'% — продолжай!'
      :pct+'% done — keep going!';
    showReminder(title, sub);
  } else if(ts.length>0&&dn===ts.length){
    var title2=S.lang==='ru'?'Все задачи выполнены ✓':'All tasks done ✓';
    var sub2=S.lang==='ru'?'Отличный день! 🎉':'Great day! 🎉';
    showReminder(title2, sub2);
  }
}

// Show reminder when app loads (after splash) if tasks exist
function initReminder(){
  setTimeout(function(){
    checkTaskReminder();
  }, 3800);

  // Periodic reminder every 30 min
  setInterval(function(){
    checkTaskReminder();
  }, 30*60*1000);
}

function resetWelcome(){
  try{localStorage.removeItem('ftg_done');}catch(e){}
  try{localStorage.removeItem('ob2_done');}catch(e){}
  try{localStorage.removeItem('clarity_access');}catch(e){}
  closeS();
  // Прячем app
  var app=document.getElementById('app');
  if(app)app.classList.remove('show');
  // Прячем ob2 если был открыт
  var ob2=document.getElementById('ob2');
  if(ob2){ob2.classList.remove('show','vis','out');ob2.style.display='none';}
  // Прячем ftgate
  var ftg=document.getElementById('ftgate');
  if(ftg){ftg.classList.remove('show','vis','out');ftg.style.display='';}
  // Показываем сплеш
  var sp=document.getElementById('sp');
  if(sp){
    sp.style.display='flex';sp.style.visibility='';sp.style.opacity='1';
    sp.classList.remove('out');
  }
  // Сбрасываем флаг инициализации чтобы initApp мог запуститься снова
  _initApp._done=false;
  // JS-анимация сплеша (работает и в preview/iframe)
  (function(){
    var sp2=document.getElementById('sp');
    if(!sp2)return;
    var logo=sp2.querySelector('.sp-logo');
    var sub=sp2.querySelector('.sp-sub');
    var bar=sp2.querySelector('.sp-bar');
    var fill=sp2.querySelector('.sp-fill');
    if(logo){logo.style.opacity='0';logo.style.transform='translateY(14px)';}
    if(sub)sub.style.opacity='0';
    if(bar)bar.style.opacity='0';
    if(fill){fill.style.transition='none';fill.style.width='0';}
    setTimeout(function(){
      if(logo){logo.style.opacity='1';logo.style.transform='translateY(0)';}
    },60);
    setTimeout(function(){if(sub)sub.style.opacity='1';},400);
    setTimeout(function(){if(bar)bar.style.opacity='1';},700);
    setTimeout(function(){
      if(fill){fill.style.transition='width 1.1s cubic-bezier(.4,0,.2,1)';fill.style.width='100%';}
    },800);
  })();
  // Через 1.8 сек — показываем экран кода
  setTimeout(function(){
    var s=document.getElementById('sp');
    if(s){s.classList.add('out');setTimeout(function(){if(s){s.style.display='none';s.style.visibility='hidden';}},500);}
    var acc=document.getElementById('access-screen');
    if(acc){acc.style.display='flex';}
    // Очищаем поле ввода кода
    var inp=document.getElementById('acc-input');if(inp)inp.value='';
    var err=document.getElementById('acc-err');if(err)err.classList.remove('show');
  },1800);
}
(function(){
  // Мгновенный отклик на тач для вкладок (без 300ms click delay)
  var _tabNames=['today','week','stats','anxiety','profile'];
  document.addEventListener('touchstart',function(e){
    var tab=e.target.closest('.tab');
    if(tab){
      var idx=_tabNames.indexOf(tab.id==='t0'?'today':tab.id==='t1'?'week':tab.id==='t2'?'stats':tab.id==='t3'?'anxiety':'profile');
      if(idx>=0){
        e.preventDefault(); // отменяем click-задержку
        showPg(_tabNames[idx],tab,e.touches[0]);
      }
      return;
    }
    // Bounce для карточек задач
    var tc=e.target.closest('.tc');if(!tc)return;
    tc._tRef=tc;tc.style.transition='transform .06s ease';tc.style.transform='scale(.96)';
  },{passive:false});
  document.addEventListener('touchend',function(e){
    var tc=e.target.closest('.tc');
    if(tc&&tc.style.transform==='scale(0.96)'){
      tc.style.transition='transform .28s cubic-bezier(.34,1.5,.64,1)';tc.style.transform='scale(1)';
    }
  },{passive:true});
  document.addEventListener('touchcancel',function(e){
    var tc=e.target.closest('.tc');
    if(tc){tc.style.transform='scale(1)';}
  },{passive:true});
})();
